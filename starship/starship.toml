"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](mauve)\
$os\
[](bg:peach fg:mauve)\
$directory\
[](bg:green fg:peach)\
$git_branch\
$git_status\
[](bg:blue fg:green)\
$python\
$nodejs\
$rust\
[](bg:surface0 fg:blue)\
$cmd_duration\
[](fg:surface0)\
$fill\
$time\
$line_break\
$character"""

palette = 'tokyo_night'

# Tokyo Night mapped onto the Catppuccin colour names used throughout this file,
# so switching themes is a one-line change to `palette` above.
[palettes.tokyo_night]
rosewater = "#ff9e64"
flamingo = "#f7768e"
pink = "#bb9af7"
mauve = "#9d7cd8"
red = "#f7768e"
maroon = "#ff757f"
peach = "#ff9e64"
yellow = "#e0af68"
green = "#9ece6a"
teal = "#73daca"
sky = "#7dcfff"
sapphire = "#2ac3de"
blue = "#7aa2f7"
lavender = "#bb9af7"
text = "#c0caf5"
subtext1 = "#a9b1d6"
subtext0 = "#9aa5ce"
overlay2 = "#737aa2"
overlay1 = "#565f89"
overlay0 = "#545c7e"
surface2 = "#414868"
surface1 = "#292e42"
surface0 = "#24283b"
base = "#1a1b26"
mantle = "#16161e"
crust = "#0f0f14"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[os]
disabled = false
style = "bg:mauve fg:base"

[os.symbols]
Windows = " "
Ubuntu = " "
Macos = " "

[directory]
style = "bg:peach fg:base"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = ".../"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Desktop" = "󰇄 "
"Projects" = " "
"projects" = " "

[git_branch]
symbol = " "
style = "bg:green fg:base"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:green fg:base"
format = "[$all_status$ahead_behind ]($style)"

[python]
symbol = " "
style = "bg:blue fg:base"
format = "[ $symbol$version ]($style)"

[nodejs]
symbol = " "
style = "bg:blue fg:base"
format = "[ $symbol$version ]($style)"

[rust]
symbol = "🦀 "
style = "bg:blue fg:base"
format = "[ $symbol$version ]($style)"

[cmd_duration]
min_time = 2_000
style = "bg:surface0 fg:text"
format = "[ 󱎫 $duration ]($style)"

[fill]
symbol = " "

[time]
disabled = false
time_format = "%I:%M%p"
style = "fg:overlay1"
format = "[$time]($style)"

[line_break]
disabled = false

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
